<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Charlas · Daniel Bautista</title>
    <meta name="description" content="Slides y material de las charlas y talleres de Daniel Bautista." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f1412;
        --surface: #171e1b;
        --border: #26302c;
        --text: #eef2ee;
        --muted: #9aa8a1;
        --accent: #ffd23f;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: 'DM Sans', system-ui, sans-serif;
        line-height: 1.5;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 72px 16px 96px;
      }
      h1, h2, h3 { font-family: 'Space Grotesk', system-ui, sans-serif; margin: 0; }
      h1 { font-size: clamp(36px, 6vw, 56px); line-height: 1.05; }
      h1 span { color: var(--accent); }
      header p { color: var(--muted); margin: 8px 0 0; }
      a { color: inherit; }
      .back { display: inline-block; margin-bottom: 32px; color: var(--muted); text-decoration: none; font-size: 15px; }
      .back:hover { color: var(--text); }

      section { margin-top: 56px; }
      section > h2 {
        font-size: 15px;
        letter-spacing: 0.12em;
        color: var(--muted);
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }
      ul { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 16px; }

      .talk {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        text-decoration: none;
        transition: border-color 0.15s, transform 0.15s;
      }
      .talk:hover, .talk:focus-visible { border-color: var(--accent); transform: translateY(-2px); }
      @media (min-width: 720px) {
        .talk.has-cover { grid-template-columns: 320px 1fr; align-items: center; }
        .talk:not(.has-cover) { padding: 24px; }
      }
      .cover {
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        border-radius: 10px;
        display: block;
        background: var(--border);
      }
      .body { display: grid; gap: 6px; }
      .meta { font-size: 13px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
      .upcoming { color: var(--bg); background: var(--accent); border-radius: 999px; padding: 1px 8px; margin-left: 6px; font-weight: 700; }
      h3 { font-size: 22px; line-height: 1.2; }
      .desc { color: var(--muted); margin: 0; }
      .cta { font-size: 15px; color: var(--accent); font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="https://kireku.dev">← kireku.dev</a>
      <header>
        <h1>Charlas <span>&amp;</span> talleres</h1>
        <p>Slides y material de lo que he presentado.</p>
      </header>
      <!--TALKS-->
    </main>
    <script>
      // La etiqueta se genera al compilar; la quitamos en el navegador cuando la fecha ya pasó.
      const today = new Date().toLocaleDateString('en-CA');
      document.querySelectorAll('[data-until]').forEach((el) => el.dataset.until < today && el.remove());
    </script>
  </body>
</html>
