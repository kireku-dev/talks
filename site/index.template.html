<!doctype html>
<html lang="es" data-color-mode="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Charlas · Daniel Bautista</title>
    <meta name="description" content="Slides y material de las charlas y talleres de Daniel Bautista." />
    <script>
      // Same preference key as kireku.dev; dark by default.
      try {
        const saved = localStorage.getItem('portfolio-color-mode');
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.colorMode = saved;
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c0c0e;
        --surface: #141417;
        --ink: #f0efec;
        --muted: #a3a3aa;
        --dim: #707078;
        --line: rgba(255, 255, 255, 0.11);
        --line-strong: rgba(255, 255, 255, 0.22);
        --accent: #e62815;
        --on-accent: #fff;
        --card: linear-gradient(145deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.012));
        --shadow: 0 24px 70px rgba(0, 0, 0, 0.24);
        --font-headline: 'Archivo', system-ui, sans-serif;
        --font-body: 'Instrument Sans', system-ui, sans-serif;
      }
      :root[data-color-mode='light'] {
        color-scheme: light;
        --bg: #f3f2ef;
        --surface: #faf9f7;
        --ink: #19191c;
        --muted: #5e5e65;
        --dim: #7b7b82;
        --line: rgba(20, 20, 25, 0.12);
        --line-strong: rgba(20, 20, 25, 0.24);
        --accent: #bd291b;
        --card: linear-gradient(145deg, rgba(255, 255, 255, 0.94), rgba(255, 255, 255, 0.55));
        --shadow: 0 24px 70px rgba(35, 30, 25, 0.08);
      }

      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-body);
        font-size: 1rem;
        line-height: 1.65;
        transition: background-color 200ms ease, color 200ms ease;
      }
      ::selection { background: var(--accent); color: var(--on-accent); }
      a { color: inherit; }
      h1, h2, h3 { font-family: var(--font-headline); font-weight: 500; margin: 0; }

      .nav {
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--bg) 82%, transparent);
        backdrop-filter: blur(14px);
      }
      .nav-inner, main {
        max-width: 1140px;
        margin: 0 auto;
        padding-inline: clamp(16px, 4vw, 40px);
      }
      .nav-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        height: 64px;
      }
      .brand {
        font-family: var(--font-headline);
        font-weight: 600;
        letter-spacing: -0.03em;
        text-decoration: none;
      }
      .brand span { color: var(--accent); }
      .nav-actions { display: flex; align-items: center; gap: 0.5rem; }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        height: 36px;
        padding: 0 0.9rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font: 500 0.82rem var(--font-body);
        text-decoration: none;
        cursor: pointer;
        transition: color 200ms ease, border-color 200ms ease;
      }
      .pill:hover, .pill:focus-visible { color: var(--ink); border-color: var(--line-strong); }

      header.hero {
        display: grid;
        gap: 1.25rem;
        padding: clamp(4rem, 10vw, 7.5rem) 0 clamp(2.5rem, 6vw, 4rem);
        border-bottom: 1px solid var(--line);
      }
      .label {
        margin: 0;
        color: var(--accent);
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 14ch;
        font-size: clamp(2.6rem, 7vw, 5.4rem);
        line-height: 0.98;
        letter-spacing: -0.055em;
      }
      h1 em { font-style: normal; color: var(--accent); }
      .lead { max-width: 52ch; margin: 0; color: var(--muted); font-size: clamp(1rem, 1.6vw, 1.15rem); }

      main { padding-bottom: clamp(4rem, 10vw, 7rem); }
      section {
        display: grid;
        gap: 1.25rem;
        padding-top: clamp(2.5rem, 6vw, 4rem);
      }
      section > h2 {
        color: var(--dim);
        font-size: clamp(2rem, 4.2vw, 3.4rem);
        line-height: 1;
        letter-spacing: -0.05em;
      }
      @media (min-width: 860px) {
        section { grid-template-columns: 1fr 3fr; gap: 2rem; }
        section > h2 { position: sticky; top: 96px; align-self: start; }
      }
      ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 1rem; }

      .talk {
        display: grid;
        gap: 1.25rem;
        padding: clamp(1rem, 2.5vw, 1.4rem);
        border: 1px solid var(--line);
        border-radius: 1.5rem;
        background: var(--card);
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.05);
        text-decoration: none;
        transition: transform 240ms ease, border-color 240ms ease, box-shadow 240ms ease;
      }
      .talk:hover, .talk:focus-visible {
        border-color: var(--line-strong);
        box-shadow: var(--shadow);
        transform: translateY(-4px);
        outline: none;
      }
      .talk:focus-visible { border-color: var(--accent); }
      @media (min-width: 720px) {
        .talk.has-cover { grid-template-columns: minmax(240px, 0.95fr) 1.2fr; align-items: center; }
        .talk:not(.has-cover) { padding: clamp(1.4rem, 3vw, 2rem); }
      }
      .cover {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        border: 1px solid var(--line);
        border-radius: 1rem;
        background: var(--surface);
      }
      .body { display: grid; gap: 0.55rem; align-content: start; }
      .meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
        color: var(--dim);
        font-size: 0.7rem;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .upcoming {
        padding: 0.1rem 0.55rem;
        border-radius: 999px;
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      h3 {
        font-size: clamp(1.3rem, 2.2vw, 1.7rem);
        line-height: 1.15;
        letter-spacing: -0.035em;
      }
      .desc { margin: 0; color: var(--muted); }
      .cta {
        margin-top: 0.4rem;
        color: var(--accent);
        font-size: 0.9rem;
        font-weight: 600;
      }

      footer {
        max-width: 1140px;
        margin: 0 auto;
        padding: 0 clamp(16px, 4vw, 40px) 3rem;
        font-size: 0.82rem;
      }
      footer > div { padding-top: 2rem; border-top: 1px solid var(--line); }
      footer a { color: var(--muted); }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition: none !important; }
        .talk:hover { transform: none; }
      }
    </style>
  </head>
  <body>
    <nav class="nav" aria-label="Principal">
      <div class="nav-inner">
        <a class="brand" href="https://kireku.dev">kireku<span>.</span>dev</a>
        <div class="nav-actions">
          <button class="pill" type="button" id="mode-toggle" aria-label="Cambiar modo de color">
            <span aria-hidden="true" id="mode-icon">☾</span><span id="mode-label">Oscuro</span>
          </button>
          <a class="pill" href="https://kireku.dev/cv">CV</a>
        </div>
      </div>
    </nav>
    <main>
      <header class="hero">
        <p class="label">Talks · Daniel Bautista</p>
        <h1>Charlas <em>&amp;</em> talleres</h1>
        <p class="lead">Slides y material de lo que he presentado: Git, colaboración, IA aplicada y desarrollo de software.</p>
      </header>
      <!--TALKS-->
    </main>
    <footer>
      <div><a href="https://kireku.dev">← Volver a kireku.dev</a></div>
    </footer>
    <script>
      // La etiqueta se genera al compilar; la quitamos en el navegador cuando la fecha ya pasó.
      const today = new Date().toLocaleDateString('en-CA');
      document.querySelectorAll('[data-until]').forEach((el) => el.dataset.until < today && el.remove());

      const root = document.documentElement;
      const icon = document.getElementById('mode-icon');
      const label = document.getElementById('mode-label');
      const render = () => {
        const light = root.dataset.colorMode === 'light';
        icon.textContent = light ? '☀' : '☾';
        label.textContent = light ? 'Claro' : 'Oscuro';
      };
      document.getElementById('mode-toggle').addEventListener('click', () => {
        root.dataset.colorMode = root.dataset.colorMode === 'light' ? 'dark' : 'light';
        try { localStorage.setItem('portfolio-color-mode', root.dataset.colorMode); } catch {}
        render();
      });
      render();
    </script>
  </body>
</html>
